<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 Shop - Fun Toys</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav>
    <a href="index.html">🏠 Home</a>
    <a href="shop.html" class="active">🌟 Shop</a>
    <a href="for-you.html">💜 For You</a>
    <a href="owner.html">🔒 Owner</a>
  </nav>

  <header>
    <h1>🌟 Toy Shop</h1>
    <p>Pick your favorite toy and we’ll bring the fun to you!</p>
  </header>

  <main>
    <section id="products">
      <h2>Available Toys</h2>
      <div class="filters" id="category-filters">
        <button class="filter-btn active" data-cat="all">All Toys</button>
      </div>
      <div id="product-list">
        <p class="placeholder">Loading toys...</p>
      </div>
    </section>

    <section id="order">
      <h2>📝 Place an Order</h2>
      <form id="order-form">
        <label>
          Your name
          <input type="text" name="customer_name" placeholder="What should we call you?" required>
        </label>
        <label>
          Phone number
          <input type="tel" name="customer_phone" placeholder="So we can reach you" required>
        </label>
        <label>
          Delivery address
          <input type="text" name="customer_address" placeholder="Where to deliver?" required>
        </label>
        <label>
          Delivery note (optional)
          <input type="text" name="delivery_note" placeholder="Any special instructions?">
        </label>
        <label>
          Which toy do you want?
          <select name="product" id="product-select" required>
            <option value="">Pick a toy</option>
          </select>
        </label>
        <label>
          Quantity
          <input type="number" name="quantity" value="1" min="1" required>
        </label>
        <button type="submit" id="submit-btn">Order Now! 🚀</button>
      </form>
      <p id="order-message"></p>
    </section>
  </main>

  <footer>
    <p>Made with ❤️ for kids</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
