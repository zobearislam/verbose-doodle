<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 Shop - Fun Toys</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav>
    <a href="index.html">🏠 Home</a>
    <a href="shop.html">🌟 Shop</a>
    <a href="for-you.html">💜 For You</a>
  </nav>

  <header>
    <h1>🌟 Toy Shop</h1>
    <p>Pick your favorite toy!</p>
  </header>

  <main>
    <section id="products">
      <h2>Available Toys</h2>
      <div id="product-list">
        <p class="placeholder">Loading toys...</p>
      </div>
    </section>

    <section id="order">
      <h2>📝 Place an Order</h2>
      <form id="order-form">
        <label>
          Your name<br>
          <input type="text" name="name" placeholder="What should we call you?" required>
        </label>
        <br>
        <label>
          Phone number<br>
          <input type="tel" name="phone" placeholder="So we can reach you" required>
        </label>
        <br>
        <label>
          Which toy do you want?<br>
          <select name="product" id="product-select" required>
            <option value="">Pick a toy</option>
          </select>
        </label>
        <br>
        <button type="submit">Order Now! 🚀</button>
      </form>
      <p id="order-message"></p>
    </section>
  </main>

  <footer>
    <p>Made with ❤️ for kids</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
